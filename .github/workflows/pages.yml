# Replace .github/workflows/pages.yml on the public repository's default branch.
# The old "Deploy Live Demo" workflow used a retired release-archive format.
name: Deploy HaviLAB Pages

on:
  repository_dispatch:
    types: [havilab-pages-ready]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: havilab-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'fjodborg/HaviLAB' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the latest compiled snapshot
        uses: actions/checkout@v4
        with:
          ref: refs/heads/gh-pages
          path: snapshot
          persist-credentials: false

      - uses: actions/configure-pages@v5

      - name: Verify and export tracked Pages files
        run: |
          mkdir "$RUNNER_TEMP/havilab-site"
          git -C snapshot archive HEAD | tar -xf - -C "$RUNNER_TEMP/havilab-site"
          python3 - "$RUNNER_TEMP/havilab-site" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          inventory = "havilab-pages-inventory.json"
          archive = root / "releases"
          if (
              {p.name for p in root.iterdir()} != {"index.html", ".nojekyll", inventory, "releases"}
              or any(p.is_symlink() for p in root.rglob("*"))
          ):
              raise SystemExit("not a HaviLAB Pages snapshot")
          releases = json.loads((root / inventory).read_text())
          launcher = re.findall(r'content="0; url=releases/([1-9][0-9]*-[1-9][0-9]*)/"',
                                (root / "index.html").read_text())
          if not isinstance(releases, dict) or len(launcher) != 1 or launcher[0] not in releases:
              raise SystemExit("the launcher does not identify an archived release")
          if {p.name for p in archive.iterdir()} != releases.keys():
              raise SystemExit("the snapshot does not contain the entire release history")
          for release, expected in releases.items():
              directory = archive / release
              if not re.fullmatch(r"[1-9][0-9]*-[1-9][0-9]*", release) or not directory.is_dir():
                  raise SystemExit(f"invalid archived release: {release}")
              files = {}
              for path in directory.rglob("*"):
                  if path.is_file():
                      with path.open("rb") as stream:
                          files[path.relative_to(directory).as_posix()] = hashlib.file_digest(stream, "sha256").hexdigest()
              digest = hashlib.sha256(json.dumps(files, sort_keys=True).encode()).hexdigest()
              if not files or digest != expected:
                  raise SystemExit(f"archived release has changed: {release}")
          print(f"Verified {len(releases)} release(s); publishing {launcher[0]}.")
          PY

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/havilab-site

      - name: Deploy verified snapshot
        id: deployment
        uses: actions/deploy-pages@v4
